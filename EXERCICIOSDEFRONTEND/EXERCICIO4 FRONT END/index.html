<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENDASt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <h2>Simulador de Vendas - Infinity Bank</h2>
    <select id="bandeira">
        <option value="visa">Visa (2%)</option>
        <option value="master">Master (1.85%)</option>
        <option value="elo">Elo (3%)</option>
    </select>
    <input type="number" id="valor" placeholder="Valor da Venda R$" step="0.01">
    <input type="number" id="parcelas" placeholder="Número de Parcelas" min="1" max="12">
    <button onclick="calcularTaxas()">Simular</button>

    <div class="resumo" id="resumo"></div>
    <script src="script.js"></script>
</body>
</html>
